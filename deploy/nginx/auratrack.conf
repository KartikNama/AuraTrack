# /etc/nginx/sites-available/auratrack
# Host AuraTrack on your server (Domain or Subdomain, e.g., auratrack.yourdomain.com or tracker.yourdomain.com)

# OPTION 1 (Recommended): High-Performance Direct Static Hosting with SPA Fallback
server {
    listen 80;
    server_name auratrack.yourdomain.com www.auratrack.yourdomain.com;

    root /var/www/AuraTrack/dist;
    index index.html;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA Routing: Fall back to /index.html for React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images, fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

